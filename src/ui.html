<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder Sync</title>
<style>
:root { --bg: #fff; --side: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; --faint: #a1a1a6; --line: rgba(0,0,0,.08); --hover: rgba(0,0,0,.045); --sel: rgba(0,0,0,.075);
  --btn: #1d1d1f; --btn-text: #fff; --field: #f2f2f4; --ok: #2f9e5b; --bad: #d1343b; --add: rgba(47,158,91,.12); --del: rgba(209,52,59,.11); --shade: rgba(0,0,0,.28); color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --side: #0e0e0f; --text: #f5f5f7; --muted: #98989d; --faint: #636366; --line: rgba(255,255,255,.09); --hover: rgba(255,255,255,.05);
  --sel: rgba(255,255,255,.09); --btn: #f5f5f7; --btn-text: #000; --field: #1c1c1e; --ok: #3fbf72; --bad: #ff5a5f; --add: rgba(63,191,114,.14); --del: rgba(255,90,95,.13); --shade: rgba(0,0,0,.6); color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
.app { display: grid; grid-template-columns: 252px 1fr; height: 100vh; }
aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 18px 10px 12px; }
.label { font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 0 10px; margin: 6px 0; }
.nav { display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; }
button.row:hover, .link:hover, .icon:hover, .menu button:hover, .file:hover { background: var(--hover); color: var(--text); }
.row.sel, button.row.sel:hover { background: var(--sel); }
.t { flex: 1; min-width: 0; }
.n, .s, .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.n { font-weight: 500; } .s { font-size: 12px; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.dot.busy { background: none; border: 1.5px solid var(--muted); border-top-color: transparent; width: 10px; height: 10px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.link { text-align: left; padding: 6px 10px; border-radius: 8px; color: var(--muted); }
.spacer { flex: 1; min-height: 16px; }
.me { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 0; border-top: 1px solid var(--line); margin-top: 8px; font-size: 13px; font-weight: 500; }
.icon { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); flex: none; }
.note { font-size: 12.5px; color: var(--faint); padding: 2px 10px 6px; }
main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.head { padding: 26px 36px 0; }
.top { display: flex; align-items: flex-start; gap: 16px; }
h1 { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin: 0; line-height: 1.15; }
h3 { margin: 0 0 6px; font-size: 17px; font-weight: 650; }
.path { color: var(--muted); font-size: 12.5px; margin-top: 4px; text-align: left; word-break: break-all; }
.path:hover, .textlink:hover, .commit:hover .subj { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
.code { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; font-size: 12px; color: var(--muted); }
.code .c { font-weight: 600; font-size: 13px; letter-spacing: .06em; padding: 8px 11px; border-radius: 8px; background: var(--field); color: var(--text); }
.status { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.tabs { display: flex; gap: 22px; padding: 0 36px; margin-top: 18px; border-bottom: 1px solid var(--line); }
.tab { padding: 9px 0 10px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover, .tab.on { color: var(--text); } .tab.on { border-bottom-color: var(--text); }
.tab small { font-size: 12px; color: var(--muted); margin-left: 4px; font-weight: 400; }
.body { flex: 1; overflow-y: auto; padding: 22px 36px 40px; }
#bodyIn { max-width: 760px; }
.btn { background: var(--btn); color: var(--btn-text); padding: 8px 16px; border-radius: 8px; font-weight: 550; white-space: nowrap; }
.btn:hover { opacity: .88; } .btn:disabled { opacity: .35; cursor: default; }
.btn.plain { background: var(--field); color: var(--text); } .btn.plain:hover { background: var(--sel); opacity: 1; }
.field { width: 100%; background: var(--field); border: 1px solid transparent; border-radius: 8px; padding: 9px 12px; outline: none; }
.field:focus { border-color: var(--faint); }
textarea.field { resize: none; height: 64px; display: block; }
.line { display: flex; gap: 8px; align-items: center; }
.small { font-size: 12.5px; color: var(--muted); }
.err, .deleted { color: var(--bad); } .new { color: var(--ok); }
.error { color: var(--bad); font-size: 13px; margin-top: 10px; } .error:empty { display: none; }
.textlink { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.repo { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; font-weight: 600; }
.branch { font-size: 12px; font-weight: 400; color: var(--muted); background: var(--field); padding: 3px 7px; border-radius: 6px; }
.repo .right { margin-left: auto; display: flex; gap: 8px; font-weight: 400; }
.composer { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; margin-bottom: 8px; }
.list { margin-top: 20px; border-top: 1px solid var(--line); }
.item, .act { display: flex; align-items: center; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
.item .kind { width: 58px; flex: none; font-size: 12px; }
.dir, .item .kind.edited, .by, .when { color: var(--muted); } .by, .when { font-size: 12.5px; flex: none; }
.commit { padding: 12px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.subj { font-weight: 500; } .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.tag { font-size: 11.5px; padding: 1px 6px; border-radius: 5px; background: var(--field); color: var(--muted); margin-left: 6px; font-weight: 400; }
.detail { padding: 6px 0 14px; border-bottom: 1px solid var(--line); }
.msg { white-space: pre-wrap; color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.file { display: flex; gap: 10px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.num { font-size: 12px; } .num .a { color: var(--ok); } .num .d { color: var(--bad); }
pre { margin: 6px 0 10px; padding: 10px 0; background: var(--field); border-radius: 8px; overflow: auto; font-size: 12px; line-height: 1.5; max-height: 420px; }
pre span { display: block; padding: 0 12px; white-space: pre; min-width: max-content; }
pre .a { background: var(--add); } pre .d { background: var(--del); } pre .h { color: var(--muted); }
.none { color: var(--muted); padding: 18px 2px; }
.welcome { margin: auto; text-align: center; max-width: 440px; padding: 24px; }
.welcome h2 { font-size: 24px; font-weight: 650; letter-spacing: -.02em; margin: 0 0 8px; }
.welcome p, .sheet p { color: var(--muted); margin: 0 0 20px; }
.welcome .line { justify-content: center; }
.shade { position: fixed; inset: 0; background: var(--shade); display: grid; place-items: center; z-index: 10; animation: fade .15s; }
.sheet { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; width: min(440px, calc(100vw - 32px)); padding: 22px 22px 18px; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.chosen { font-size: 13px; padding: 9px 12px; border-radius: 8px; background: var(--field); word-break: break-all; }
.chosen:empty::before { content: "Nothing chosen"; color: var(--muted); }
.big { font-size: 40px; font-weight: 650; letter-spacing: .12em; text-align: center; padding: 18px 0; border-radius: 10px; background: var(--field); }
.setrow { padding: 12px 0; border-bottom: 1px solid var(--line); }
.menu { position: fixed; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 5px; box-shadow: 0 12px 34px rgba(0,0,0,.18); z-index: 11; min-width: 200px; }
.menu button { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 6px; font-size: 13.5px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--btn); color: var(--btn-text); padding: 9px 16px; border-radius: 10px; font-size: 13.5px; z-index: 20; animation: fade .18s; max-width: 80vw; }
@keyframes fade { from { opacity: 0; } }
@media (max-width: 720px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } aside { border: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
  .head, .tabs, .body { padding-left: 16px; padding-right: 16px; } .top { flex-direction: column; } .code { margin-left: 0; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="label">Folders</div>
    <div class="nav" id="folders"></div>
    <button class="link" data-do="new">New shared folder</button>
    <button class="link" data-do="join">Join with a code</button>
    <div class="spacer"></div>
    <div class="label">On this network</div>
    <div class="nav" id="peers"></div>
    <div class="me"><span class="ell" id="me"></span>
      <button class="icon" data-do="settings" title="Settings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
  </aside>
  <main id="main"></main>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const api = async (path, body) => {
  const r = await fetch(path, body && { method: 'POST', headers: { 'X-FS': '1' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  return j;
};
const ago = ms => {
  const s = (Date.now() - ms) / 1000;
  return s < 45 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : s < 604800 ? Math.round(s / 86400) + ' d ago'
    : new Date(ms).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
};
const size = b => ['B', 'KB', 'MB', 'GB'].reduce((out, u, i) => b >= 1024 ** i ? (i ? (b / 1024 ** i).toFixed(1) : b) + ' ' + u : out, '0 B');
const names = a => a.length < 2 ? a[0] || '' : a.slice(0, -1).join(', ') + ' and ' + a.at(-1);
const pathHtml = p => { const i = p.lastIndexOf('/') + 1; return `<span class="dir">${esc(p.slice(0, i))}</span>${esc(p.slice(i))}`; };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const keep = (k, v) => { try { return v === undefined ? localStorage.getItem(k) || '' : localStorage.setItem(k, v); } catch { return ''; } };
const toast = t => { document.querySelectorAll('.toast').forEach(x => x.remove()); document.body.insertAdjacentHTML('beforeend', `<div class="toast">${esc(t)}</div>`); setTimeout(() => $('.toast')?.remove(), 2800); };

let S, G, L, sel = keep('sel'), tab = keep('tab') || 'changes', open = {}, lastSide = '', lastHead = '', lastBody = '';
const folder = () => S?.folders.find(f => f.id === sel);
const statusOf = f => f.error ? ['bad', f.error] : f.pending || f.current ? ['busy', f.current ? 'Getting ' + f.current.split('/').pop() : `Getting ${plural(f.pending, 'file')}`]
  : !f.peers.length ? ['', 'No other laptop on this network right now'] : f.synced ? ['ok', 'Up to date with ' + names(f.peers)] : ['busy', 'Catching up with ' + names(f.peers)];

function render() {
  const side = (S.folders.map(f => `<button class="row ${f.id === sel ? 'sel' : ''}" data-f="${f.id}"><span class="t"><div class="n">${esc(f.name)}</div>
      <div class="s">${f.peers.length ? 'With ' + esc(names(f.peers)) : 'Only here'}</div></span><span class="dot ${statusOf(f)[0]}"></span></button>`).join('') || '<div class="note">None yet</div>')
    + '\0' + (S.peers.map(p => `<div class="row"><span class="t"><div class="n">${esc(p.name)}</div><div class="s">${p.shared.length ? 'Shares ' + esc(names(p.shared)) : p.others ? 'Shares other folders' : 'Nothing shared'}</div></span></div>`).join('') || '<div class="note">No other laptops found</div>');
  if (side !== lastSide) { lastSide = side; [$('#folders').innerHTML, $('#peers').innerHTML] = side.split('\0'); $('#me').textContent = S.device.name; }
  const f = folder();
  if (!f) {
    if (lastHead !== 'welcome') $('#main').innerHTML = `<div class="welcome"><h2>Keep a folder the same on every laptop</h2><p>Share a folder, then invite anyone on this network with a 4-digit code. Their changes arrive here as they save, and yours there.</p>
      <div class="line"><button class="btn" data-do="new">Share a folder</button><button class="btn plain" data-do="join">Join with a code</button></div></div>`;
    return lastHead = 'welcome';
  }
  const [dot, text] = statusOf(f), n = G?.repo ? G.changes.length : 0;
  const head = `<div class="head"><div class="top"><div class="t"><h1>${esc(f.name)}</h1><button class="path" data-do="open">${esc(f.path)}</button></div>
    <div class="code">${f.invite ? `Code<button class="c mono" data-do="invite">${esc(f.invite.code)}</button>` : '<button class="btn plain" data-do="invite">Invite</button>'}<button class="icon" data-do="menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button></div></div>
    <div class="status"><span class="dot ${dot}"></span><span class="${dot === 'bad' ? 'err' : ''}">${esc(text)}</span>·<span>${plural(f.files, 'file')}, ${size(f.bytes)}</span></div></div>
    <div class="tabs">${[['changes', 'Changes' + (n ? `<small>${n}</small>` : '')], ['history', 'History'], ['activity', 'Activity']].map(([k, t]) => `<button class="tab ${tab === k ? 'on' : ''}" data-tab="${k}">${t}</button>`).join('')}</div>`;
  if (head !== lastHead) {
    const old = $('#bodyIn'), top = $('.body')?.scrollTop;
    lastHead = head; $('#main').innerHTML = head + '<div class="body"><div id="bodyIn"></div></div>';
    if (old && lastBody) $('.body').replaceChild(old, $('#bodyIn')); // keeps what is typed in it
    $('.body').scrollTop = top || 0;
  }
  const el = $('#bodyIn'), html = tab === 'activity' ? activityHtml(f) : tab === 'history' ? historyHtml() : changesHtml();
  if (html === lastBody) return;
  const typed = ['msg', 'url'].map(id => $('#' + id)?.value), focus = document.activeElement?.id;
  lastBody = el.innerHTML = html;
  ['msg', 'url'].forEach((id, i) => { if (typed[i] != null && $('#' + id)) $('#' + id).value = typed[i]; });
  if (focus) $('#' + focus)?.focus();
}

const activityHtml = f => f.activity.map(a => {
  const who = a.mine ? 'You' : esc(a.who || 'Someone'), p = `<b style="font-weight:500">${esc(a.path)}</b>`;
  const t = { changed: `${who} changed ${p}`, deleted: `${who} deleted ${p}`, got: `${p} from ${who}`, conflict: `${p} was changed here and by ${who}; both copies kept`, followed: `Moved to the newest commit, ${esc(a.path)}` }[a.kind];
  return `<div class="act"><span class="t ell">${t}</span><span class="when">${ago(a.at)}</span></div>`;
}).join('') || '<div class="none">Nothing has changed since Folder Sync started.</div>';

function changesHtml() {
  if (!G) return '<div class="none">Loading…</div>';
  if (G.no_git) return `<div class="none">Git is not installed on this laptop. <button class="textlink" data-url="https://git-scm.com/downloads">Get Git</button>, then open this again.</div>`;
  const err = `<div class="error">${esc(G.error)}</div>`;
  if (!G.repo) {
    const short = G.suggest.replace(/^https:\/\/github.com\/|\.git$/g, '');
    return `<h3>Connect a GitHub repository</h3><p class="small">The files here stay as they are and the repository's history comes in beside them. The other laptops connect to it by themselves.</p>
      <div class="line"><input class="field" id="url" placeholder="owner/repo or https://github.com/owner/repo" value="${esc(short)}" spellcheck="false">
      <button class="btn" data-do="connect" ${G.busy ? 'disabled' : ''}>${G.busy ? 'Connecting…' : 'Connect'}</button></div>${short ? `<p class="small">The others use ${esc(short)}.</p>` : ''}${err}`;
  }
  const n = G.changes.length, id = G.identity, act = (k, t) => `<button class="btn plain" data-do="${k}" ${G.busy ? 'disabled' : ''}>${t}</button>`;
  return `<div class="repo">${G.repo_web ? `<button data-url="${esc(G.repo_web)}" title="Open on GitHub">${esc(G.repo_name)}</button>` : esc(G.repo_name || 'No remote')}
      ${G.branch ? `<span class="branch mono">${esc(G.branch)}</span>` : ''}<div class="right">${G.behind ? act('pull', `Get ${plural(G.behind, 'new commit')}`) : ''}${G.ahead ? act('push', `Push ${plural(G.ahead, 'commit')}`) : ''}</div></div>
    <div class="composer"><textarea class="field" id="msg" placeholder="${n ? 'What changed (optional)' : 'Nothing to commit'}" ${n ? '' : 'disabled'}></textarea>
      <button class="btn" data-do="commit" ${n && !G.busy ? '' : 'disabled'}>${G.busy ? 'Working…' : G.remote ? 'Commit and push' : 'Commit'}</button></div>
    <div class="small">${id.name && id.email ? `As ${esc(id.name)} &lt;${esc(id.email)}&gt; · <button class="textlink" data-do="identity">Change</button>` : 'Commits need your name and email · <button class="textlink" data-do="identity">Set them</button>'}</div>${err}
    ${n ? `<div class="list">${G.changes.map(c => `<div class="item"><span class="kind ${c.kind}">${c.kind}</span><span class="t ell" title="${esc(c.path)}">${pathHtml(c.path)}</span><span class="by">${esc(c.by)}</span></div>`).join('')}</div>` : '<div class="none">No changes since the last commit.</div>'}`;
}

function historyHtml() {
  if (G && !G.repo) return '<div class="none">Connect a repository in Changes to see its history here.</div>';
  if (!L) return '<div class="none">Loading…</div>';
  return L.commits.map(c => `<div class="commit" data-c="${c.hash}"><div class="subj">${esc(c.subject)}${c.local ? '<span class="tag">Not pushed</span>' : ''}</div>
    <div class="meta">${esc(c.author)} · ${ago(c.at)} · <span class="mono">${c.hash.slice(0, 7)}</span></div></div>${open.commit === c.hash ? detailHtml(c) : ''}`).join('') || '<div class="none">No commits yet.</div>';
}
const detailHtml = c => !open.show ? '<div class="detail small">Loading…</div>' : `<div class="detail">${open.show.message.trim() !== c.subject ? `<p class="msg">${esc(open.show.message.trim())}</p>` : ''}
  ${open.show.files.map(f => `<div class="file" data-file="${esc(f.path)}"><span class="t ell">${pathHtml(f.path)}</span><span class="num mono"><span class="a">+${esc(f.added)}</span> <span class="d">−${esc(f.removed)}</span></span></div>${open.file === f.path ? diffHtml(open.diff) : ''}`).join('')}
  ${L.repo_web ? `<p class="small" style="padding-left:8px"><button class="textlink" data-url="${esc(L.repo_web)}/commit/${c.hash}">View on GitHub</button></p>` : ''}</div>`;
function diffHtml(d) {
  const lines = (d ?? '').split('\n').filter(l => !/^(diff --git|index |--- |\+\+\+ |new file mode|deleted file mode|Binary files)/.test(l));
  if (d == null || !lines.join('').trim()) return `<div class="small" style="padding:4px 8px">${d == null ? 'Loading…' : 'No text to show.'}</div>`;
  return `<pre class="mono">${lines.map(l => `<span class="${{ '+': 'a', '-': 'd', '@': 'h' }[l[0]] || ''}">${esc(l) || ' '}</span>`).join('')}</pre>`;
}

async function tick() {
  try { S = await api('/api/state'); } catch { return; }
  if (!folder() && S.folders.length) select(S.folders[0].id); else render();
}
async function gitTick() {
  const f = folder(); if (!f) return;
  try {
    const g = await api('/api/git?f=' + f.id);
    if (f.id !== sel) return;
    if (tab === 'history' && (G?.head !== g.head || !L)) loadLog();
    G = g; render();
  } catch {}
}
async function loadLog() {
  const id = sel;
  try { const l = await api('/api/git/log?f=' + id); if (id === sel) { L = l; render(); } } catch {}
}
function select(id) {
  sel = id; keep('sel', id);
  G = L = null; open = {}; lastHead = lastBody = lastSide = '';
  render(); gitTick();
}
function redraw() { lastBody = ''; render(); }

function sheet(html, init) {
  document.body.insertAdjacentHTML('beforeend', `<div class="shade"><div class="sheet">${html}<div class="error" id="er"></div></div></div>`);
  const sh = document.body.lastElementChild, close = () => sh.remove();
  sh.onmousedown = e => e.target === sh && close();
  sh.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  const fail = e => $('#er', sh).textContent = e.message;
  init?.(sh, close, fail);
  sh.querySelector('input')?.focus();
}
const foot = go => `<div class="foot"><button class="btn plain" data-close>Cancel</button><button class="btn" id="go" ${go === 'Save' || go === 'Stop syncing' ? '' : 'disabled'}>${go}</button></div>`;

function addSheet(join) {
  let path = '';
  sheet(join ? `<h3>Join a folder</h3><p>Type the code the other laptop shows under Invite, then choose where to keep the folder on this one.</p>
      <div class="stack"><input class="field mono" id="cd" placeholder="4 digits" maxlength="4" inputmode="numeric" autocomplete="off"><div class="chosen" id="ch"></div><button class="btn plain" id="pk">Choose where…</button></div>${foot('Join')}`
    : `<h3>Share a folder</h3><p>Everything in it is kept the same on each laptop that joins. What its .gitignore lists stays on each laptop.</p>
      <div class="stack"><div class="chosen" id="ch"></div><button class="btn plain" id="pk">Choose folder…</button></div>${foot('Share')}`, (sh, close, fail) => {
    const code = () => $('#cd', sh)?.value || '', check = () => $('#go', sh).disabled = !path || (join && code().length !== 4);
    if (join) $('#cd', sh).oninput = e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); check(); };
    $('#pk', sh).onclick = async () => {
      try { path = (await api('/api/pick', { title: join ? 'Choose a folder for it (an empty one)' : 'Choose a folder to share' })).path || path; } catch (e) { fail(e); }
      $('#ch', sh).textContent = path; check();
    };
    $('#go', sh).onclick = async () => {
      try {
        const r = await api(join ? '/api/folders/join' : '/api/folders/new', { path, code: code() });
        close(); S = await api('/api/state');
        select((S.folders.find(x => x.id === r.message || x.path.toLowerCase() === path.toLowerCase()) || S.folders.at(-1)).id);
        join ? toast(r.message) : inviteSheet(folder());
      } catch (e) { fail(e); }
    };
  });
}
async function inviteSheet(f) {
  try {
    const inv = f.invite || await api('/api/invite', { f: f.id });
    sheet(`<h3>Invite to ${esc(f.name)}</h3><p>On each other laptop, choose Join with a code and type this. It works for 10 minutes, for everyone you give it to.</p>
      <div class="big mono">${esc(inv.code)}</div><div class="foot"><button class="btn" data-close>Done</button></div>`);
  } catch (e) { toast(e.message); }
}
function settingsSheet() {
  sheet(`<h3>Settings</h3>
    <div class="setrow"><p class="small">This laptop's name</p><div class="line"><input class="field" id="nm" value="${esc(S.device.name)}"><button class="btn plain" id="sv">Save</button></div></div>
    <div class="setrow"><p class="small">Laptops added by address, for networks that keep laptops from finding each other. This one is at ${esc(S.addresses.join(', ') || 'no address')}.</p>
      <div class="line"><input class="field" id="ad" placeholder="192.168.1.20" spellcheck="false"><button class="btn plain" id="add">Add</button></div>
      ${S.manual.map(m => `<p class="small">${esc(m)} · <button class="textlink" data-rm="${esc(m)}">Remove</button></p>`).join('')}</div>
    <p class="small" style="margin-top:12px">Folder Sync ${esc(S.version)} keeps syncing after its window is closed; opening it again brings the window back.</p>
    <div class="foot"><button class="btn plain" id="quit">Quit Folder Sync</button><button class="btn" data-close>Done</button></div>`, (sh, close, fail) => {
    const post = (path, body, done) => api(path, body).then(() => { done && toast(done); close(); tick(); }, fail);
    $('#sv', sh).onclick = () => post('/api/device', { name: $('#nm', sh).value }, 'Saved');
    $('#add', sh).onclick = () => post('/api/peers/add', { addr: $('#ad', sh).value }, 'Added');
    sh.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => post('/api/peers/remove', { addr: b.dataset.rm }));
    $('#quit', sh).onclick = async () => { await api('/api/quit', {}); document.body.innerHTML = '<div class="welcome" style="margin-top:30vh"><h2>Folder Sync has quit</h2><p>Open it again to sync.</p></div>'; window.close(); };
  });
}
function menu(anchor) {
  const f = folder(), r = anchor.getBoundingClientRect();
  document.body.insertAdjacentHTML('beforeend', `<div class="menu" style="top:${r.bottom + 6}px;right:${Math.max(8, innerWidth - r.right)}px"><button data-do="open">Open folder</button><button data-m class="err">Stop syncing this folder</button></div>`);
  const m = document.body.lastElementChild;
  setTimeout(() => document.addEventListener('click', () => m.remove(), { once: true }));
  $('[data-m]', m).onclick = () => sheet(`<h3>Stop syncing ${esc(f.name)}?</h3><p>The files stay on this laptop. Changes stop going to and coming from the others.</p>${foot('Stop syncing')}`, (sh, close) => {
    $('#go', sh).onclick = async () => { await api('/api/folders/remove', { id: f.id }); close(); sel = ''; lastHead = ''; tick(); };
  });
}

async function run(path, body) {
  if (G) { G.busy = true; redraw(); }
  try { toast((await api(path, { f: sel, ...body })).message); return true; } catch (e) { toast(e.message); return false; }
  finally { await gitTick(); if (tab === 'history') loadLog(); }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-f],[data-tab],[data-do],[data-url],[data-c],[data-file]'), d = t?.dataset;
  if (!t) return;
  if (d.f) return select(d.f);
  if (d.tab) { tab = d.tab; keep('tab', tab); lastHead = ''; if (tab === 'history') loadLog(); return redraw(); }
  if (d.url) return api('/api/open-url', { url: d.url });
  if (d.file !== undefined) {
    open.file = open.file === d.file ? '' : d.file; open.diff = null; redraw();
    if (open.file) { open.diff = (await api(`/api/git/diff?f=${sel}&c=${open.commit}&path=${encodeURIComponent(open.file)}`).catch(() => ({ diff: '' }))).diff; redraw(); }
    return;
  }
  if (d.c) {
    open = open.commit === d.c ? {} : { commit: d.c }; redraw();
    if (open.commit) { open.show = await api(`/api/git/show?f=${sel}&c=${d.c}`).catch(() => ({ message: '', files: [] })); redraw(); }
    return;
  }
  const f = folder();
  ({
    new: () => addSheet(false), join: () => addSheet(true), settings: () => S && settingsSheet(), menu: () => menu(t),
    open: () => api('/api/open', { f: f.id }), invite: () => inviteSheet(f),
    identity: () => sheet(`<h3>Name on your commits</h3><p>Use the email of your GitHub account, so GitHub shows the commits as yours.</p>
      <div class="stack"><input class="field" id="nm" placeholder="Name" value="${esc(G.identity.name)}"><input class="field" id="em" placeholder="Email" value="${esc(G.identity.email)}"></div>${foot('Save')}`,
      (sh, close, fail) => $('#go', sh).onclick = () => api('/api/git/identity', { f: sel, name: $('#nm', sh).value, email: $('#em', sh).value }).then(() => { close(); gitTick(); }, fail)),
    connect: () => run('/api/git/connect', { url: $('#url').value }),
    commit: async () => { if (await run('/api/git/commit', { message: $('#msg').value }) && $('#msg')) $('#msg').value = ''; },
    pull: () => run('/api/git/pull'), push: () => run('/api/git/push'),
  })[d.do]?.();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.shade,.menu').forEach(x => x.remove());
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'msg') $('[data-do="commit"]:not(:disabled)')?.click();
});

tick().then(gitTick);
setInterval(tick, 1000);
setInterval(() => tab !== 'activity' && gitTick(), 2500);
setInterval(() => tab === 'activity' && redraw(), 30000);
</script>
</body>
</html>
