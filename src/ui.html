<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Githost</title>
<style>
/* One light theme: soft pastel surfaces, square-ish corners, plain buttons. */
:root {
  --bg: #f7f6f2; --panel: #ffffff; --rail: #eef1f5; --ink: #23262d; --ink2: #5b616e; --ink3: #8d939e; --line: #e2e4e9; --soft: #f3f4f7; --soft2: #e9ecf2;
  --pri: #dbe5f5; --pri-b: #b9c9e6; --pri-t: #23395f; --ok: #3f8f5f; --bad: #b5473f; --bad-bg: #f8e3e0; --add: #e6f3e9; --del: #f9e7e4; --shade: rgba(35,38,45,.18);
  --av-l: 86%; --av-s: 48%; --av-t: 30%; color-scheme: light;
  --text: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Code", "Cascadia Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: .92em; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }

.rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 16px 10px 10px; gap: 1px; }
.brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px 14px; font-weight: 600; }
.sec { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); padding: 14px 8px 6px; }
.proj { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 4px; border-left: 2px solid transparent; }
.proj:hover { background: var(--soft2); }
.proj.sel { background: var(--panel); border-left-color: var(--pri-t); }
.proj .n { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.proj .row { display: flex; align-items: center; gap: 8px; margin-top: 5px; color: var(--ink3); font-size: 12px; }
.rail .add { text-align: left; padding: 6px 10px; border-radius: 4px; color: var(--ink2); display: flex; gap: 8px; align-items: center; }
.rail .add:hover { background: var(--soft2); color: var(--ink); }
.rail .add b { font: 500 14px/1 var(--mono); width: 16px; text-align: center; color: var(--ink3); }
.near { display: flex; align-items: center; gap: 8px; padding: 5px 10px; font-size: 13px; }
.near .s { color: var(--ink3); font-size: 12px; }
.handle { font-size: 12px; font-weight: 500; color: var(--pri-t); }
.me { display: flex; align-items: center; gap: 8px; padding: 10px 4px 0 10px; margin-top: 8px; border-top: 1px solid var(--line); font-weight: 600; font-size: 13px; }
.me .icon { margin-left: auto; }
.icon { width: 28px; height: 28px; border-radius: 4px; display: grid; place-items: center; color: var(--ink3); flex: none; }
.icon:hover { background: var(--soft2); color: var(--ink); }
.quiet { color: var(--ink3); font-size: 12.5px; padding: 4px 10px; }

.av { --sz: 22px; width: var(--sz); height: var(--sz); border-radius: 50%; flex: none; display: inline-grid; place-items: center;
  background: hsl(var(--h) var(--av-s) var(--av-l)); color: hsl(var(--h) 40% var(--av-t)); font: 650 calc(var(--sz) * .4)/1 var(--text); }
.av.lg { --sz: 30px; } .av.sm { --sz: 18px; }
.stack { display: flex; } .stack .av { box-shadow: 0 0 0 2px var(--rail); } .stack .av + .av { margin-left: -5px; }
.head .stack .av { box-shadow: 0 0 0 2px var(--bg); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink3); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.dot.busy { background: var(--pri-t); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }

main { min-width: 0; min-height: 0; overflow-y: auto; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 40px 56px; }
.head { padding: 28px 0 20px; display: flex; gap: 20px; align-items: flex-end; position: sticky; top: 0; background: var(--bg); z-index: 2; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.head .t { flex: 1; min-width: 0; }
.status { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-size: 13px; }
.status.bad { color: var(--bad); }
h1 { font: 600 30px/1.1 var(--display); letter-spacing: -.02em; margin: 6px 0 8px; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--ink3); font-size: 12.5px; }
.facts button:hover { color: var(--ink); } .facts .ell { max-width: 100%; }
.chip { font: 12px var(--mono); color: var(--ink2); background: var(--soft2); padding: 1px 6px; border-radius: 3px; }
.side { display: flex; align-items: center; gap: 10px; flex: none; }
.bar { height: 2px; margin: -21px 0 19px; background: linear-gradient(90deg, transparent, var(--pri-b), transparent) 0 0 / 40% 100% no-repeat; animation: slide 1.1s linear infinite; }
@keyframes slide { from { background-position: -40% 0; } to { background-position: 140% 0; } }

.btn { background: var(--pri); color: var(--pri-t); border: 1px solid var(--pri-b); padding: 6px 14px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
.btn:hover { background: #cfdcf1; } .btn:disabled { opacity: .45; cursor: default; background: var(--pri); }
.btn.ghost { background: var(--panel); color: var(--ink); border-color: var(--line); font-weight: 500; } .btn.ghost:hover { background: var(--soft); }
.pill { display: inline-flex; align-items: center; gap: 8px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; }
.card h2 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); margin: 0; display: flex; align-items: center; gap: 10px; }
.card h2 .acts { margin-left: auto; display: flex; gap: 8px; text-transform: none; letter-spacing: 0; }
.card h3 { font: 600 17px var(--display); margin: 4px 0 6px; }
.card p { color: var(--ink2); margin: 0 0 14px; max-width: 560px; }
.field { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; outline: none; }
.field:focus { border-color: var(--pri-b); box-shadow: 0 0 0 3px var(--pri); }
textarea.field { resize: none; height: 56px; display: block; margin-top: 12px; }
.foot { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.foot .who { display: flex; align-items: center; gap: 8px; color: var(--ink3); font-size: 12.5px; min-width: 0; margin-right: auto; }
kbd { font: 11px var(--mono); color: var(--ink3); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.link { color: var(--pri-t); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--pri-b); }
.link:hover { text-decoration-color: currentColor; }
.err { color: var(--bad); background: var(--bad-bg); border-radius: 4px; padding: 6px 10px; font-size: 13px; margin-top: 10px; } .err:empty { display: none; }
.files { margin: 12px -6px 0; border-top: 1px solid var(--line); padding-top: 6px; }
.file { display: flex; align-items: center; gap: 10px; padding: 5px 6px; border-radius: 3px; font-size: 13.5px; }
.file .k { font: 600 12px var(--mono); width: 14px; text-align: center; color: var(--ink3); }
.file .k.new { color: var(--ok); } .file .k.deleted { color: var(--bad); }
.dir { color: var(--ink3); }
.stat { font: 12px var(--mono); white-space: nowrap; margin-left: auto; } .plus { color: var(--ok); } .minus { color: var(--bad); } .stat .dim, .dim { color: var(--ink3); }
.blocks { display: inline-flex; gap: 2px; margin-left: 8px; } .blocks i { width: 7px; height: 7px; border-radius: 1px; background: var(--soft2); } .blocks i.g { background: #8fcaa2; } .blocks i.r { background: #e6a39b; }
.tr { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px calc(6px + var(--d) * 18px); border-radius: 3px; font-size: 13.5px; }
.tr:hover { background: var(--soft); }
.tr.folder { color: var(--ink2); cursor: pointer; font-weight: 500; } .tr.folder svg { color: var(--ink3); flex: none; }
.tr .chev { width: 10px; color: var(--ink3); font: 10px var(--mono); flex: none; }
.tr .gap { width: 10px; flex: none; }
.newtag { font-size: 11px; font-weight: 600; border-radius: 3px; padding: 0 5px; } .newtag.new { color: var(--ok); background: #e2f1e6; } .newtag.deleted { color: var(--bad); background: var(--bad-bg); }
.people { margin-top: 18px; }
.people .bar2 { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--soft2); margin: 10px 0 12px; }
.people .bar2 i { background: hsl(var(--h) 50% 72%); }
.plist { display: flex; flex-wrap: wrap; gap: 8px; }
.person { display: flex; align-items: center; gap: 8px; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; font-size: 13px; }
.person .c { color: var(--ink3); font-size: 12px; }

.line { position: relative; margin-top: 26px; padding-left: 28px; }
.line::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
.ev { position: relative; padding: 8px 0; }
.ev::before { content: ""; position: absolute; left: -25px; top: 14px; width: 7px; height: 7px; border-radius: 50%; background: var(--bg); border: 1px solid var(--ink3); }
.ev.c::before { width: 11px; height: 11px; left: -27px; top: 14px; border: 1px solid hsl(var(--h) 40% 62%); background: hsl(var(--h) 55% 84%); }
.ev.c { padding: 11px 0; cursor: pointer; }
.ev .s { font-weight: 600; }
.ev.c:hover .s { color: var(--pri-t); }
.ev .m { display: flex; align-items: center; gap: 8px; color: var(--ink3); font-size: 12.5px; margin-top: 3px; }
.ev.a { color: var(--ink2); font-size: 13px; display: flex; gap: 10px; align-items: center; }
.ev.a .when { margin-left: auto; color: var(--ink3); font-size: 12px; flex: none; }
.tag { font-size: 11px; font-weight: 600; color: #8a5a12; background: #f8ecd4; border-radius: 3px; padding: 0 5px; }
.open { margin: 2px 0 8px; padding: 8px 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.open .msg { white-space: pre-wrap; color: var(--ink2); font-size: 13px; margin: 2px 6px 8px; }
.open .file { cursor: pointer; } .open .file:hover { background: var(--soft); }
.num { margin-left: auto; font: 12px var(--mono); } .num .a { color: var(--ok); } .num .d { color: var(--bad); }
pre { margin: 4px 0 8px; padding: 8px 0; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; overflow: auto; font: 12px/1.55 var(--mono); max-height: 440px; }
pre span { display: block; padding: 0 12px; white-space: pre; min-width: max-content; }
pre .a { background: var(--add); } pre .d { background: var(--del); } pre .h { color: var(--ink3); }
.none { color: var(--ink3); padding: 12px 0; }

.hello { max-width: 720px; margin: 0 auto; padding: 14vh 40px 40px; }
.hello h1 { font-size: 40px; margin: 0 0 14px; }
.hello p { color: var(--ink2); font-size: 15px; max-width: 520px; margin: 0 0 26px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 40px 0 0; }
.steps div { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; color: var(--ink2); font-size: 13px; }
.steps b { display: block; font: 600 12px var(--mono); color: var(--pri-t); margin-bottom: 6px; }
.steps strong { display: block; color: var(--ink); font-size: 14px; margin-bottom: 2px; }

.shade { position: fixed; inset: 0; background: var(--shade); display: grid; place-items: center; z-index: 10; animation: fade .14s; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: min(440px, calc(100vw - 32px)); padding: 22px 22px 18px; box-shadow: 0 18px 50px rgba(35,38,45,.18); animation: rise .16s ease-out; }
.sheet h3 { font: 600 19px var(--display); margin: 0 0 6px; }
.sheet p { color: var(--ink2); margin: 0 0 18px; }
.sheet .foot { justify-content: flex-end; margin-top: 20px; }
.tiles { display: flex; gap: 8px; justify-content: center; margin: 4px 0 8px; }
.tiles > * { width: 54px; height: 64px; border-radius: 4px; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; font: 600 30px/1 var(--mono); text-align: center; outline: none; padding: 0; color: var(--pri-t); }
.tiles input:focus { border-color: var(--pri-b); box-shadow: 0 0 0 3px var(--pri); }
.timer { text-align: center; color: var(--ink3); font-size: 12.5px; }
.chosen { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 4px; background: var(--soft); border: 1px dashed var(--pri-b); color: var(--ink2); width: 100%; text-align: left; margin-top: 12px; word-break: break-all; }
.chosen:hover { color: var(--ink); background: var(--pri); }
.set { padding: 12px 0; border-bottom: 1px solid var(--line); } .set:last-of-type { border: 0; }
.set .k { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); margin-bottom: 8px; }
.set .row { display: flex; gap: 8px; }
.menu { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px; box-shadow: 0 10px 30px rgba(35,38,45,.14); z-index: 11; min-width: 200px; }
.menu button { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 3px; font-size: 13.5px; }
.menu button:hover { background: var(--soft2); }
.menu .danger { color: var(--bad); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 4px; font-size: 13px; z-index: 20; animation: fade .16s; max-width: 80vw; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .rail { border: 0; border-bottom: 1px solid var(--line); max-height: 38vh; overflow-y: auto; }
  .wrap, .hello { padding-left: 16px; padding-right: 16px; } .head { flex-direction: column; align-items: flex-start; } .steps { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="5" width="11" height="11" rx="3"/><rect x="7" y="2" width="11" height="11" rx="3" fill="var(--rail)"/></svg>Githost</div>
    <div class="sec">Projects</div>
    <div id="folders"></div>
    <button class="add" data-do="new"><b>+</b>Share a folder</button>
    <button class="add" data-do="join"><b>#</b>Join with a code</button>
    <div style="flex:1"></div>
    <div class="sec">Nearby</div>
    <div id="peers"></div>
    <div class="me" id="me"></div>
  </aside>
  <main id="main"></main>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const api = async (path, body) => {
  const r = await fetch(path, body && { method: 'POST', headers: { 'X-FS': '1' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  return j;
};
const ago = ms => {
  const s = (Date.now() - ms) / 1000;
  return s < 45 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : s < 604800 ? Math.round(s / 86400) + ' d ago'
    : new Date(ms).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
};
const size = b => ['B', 'KB', 'MB', 'GB'].reduce((out, u, i) => b >= 1024 ** i ? (i ? (b / 1024 ** i).toFixed(1) : b) + ' ' + u : out, '0 B');
const names = a => a.length < 2 ? a[0] || '' : a.slice(0, -1).join(', ') + ' and ' + a.at(-1);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const pathHtml = p => { const i = p.lastIndexOf('/') + 1; return `<span class="dir">${esc(p.slice(0, i))}</span>${esc(p.slice(i))}`; };
const keep = (k, v) => { try { return v === undefined ? localStorage.getItem(k) || '' : localStorage.setItem(k, v); } catch { return ''; } };
const toast = t => { document.querySelectorAll('.toast').forEach(x => x.remove()); document.body.insertAdjacentHTML('beforeend', `<div class="toast">${esc(t)}</div>`); setTimeout(() => $('.toast')?.remove(), 2800); };
// Everyone keeps one colour and two letters, worked out from their name.
const hue = n => { let h = 2166136261; for (const c of String(n)) h = Math.imul(h ^ c.codePointAt(0), 16777619) >>> 0; return h % 24 * 15; };
const ini = n => { const p = String(n).split(/[^\p{L}\p{N}]+/u).filter(Boolean); return (p.length > 1 ? p[0][0] + p[1][0] : String(n).slice(0, 2)).toUpperCase(); };
const av = (n, cls = '') => `<span class="av ${cls}" style="--h:${hue(n)}" title="${esc(n)}${S?.handles?.[n] && S.handles[n] !== n ? ' · ' + esc(S.handles[n]) : ''}">${esc(ini(n))}</span>`;
// A laptop's name with its owner's git name, so PC1145 always says whose it is.
const hd = n => { const h = S?.handles?.[n]; return h && h !== n ? h : ''; };
const label = n => hd(n) ? `${n} (${hd(n)})` : n;
const who = n => n === S.device.name ? 'You' : label(n);
// Lines added and removed, in green and red, with five squares for the share of each (as GitHub does).
const nums = (a, r) => `<span class="plus">+${(a || 0).toLocaleString()}</span> <span class="minus">−${(r || 0).toLocaleString()}</span>`;
const blocks = (a, r) => { const t = a + r, g = t ? Math.round(5 * a / t) : 0; return `<span class="blocks">${[0, 1, 2, 3, 4].map(i => `<i class="${!t ? '' : i < g ? 'g' : 'r'}"></i>`).join('')}</span>`; };
const stat = (a, r) => a == null ? '<span class="stat dim">binary</span>' : `<span class="stat">${nums(a, r)}</span>${blocks(a, r || 0)}`;
const kindTag = k => k === 'new' || k === 'deleted' ? `<span class="newtag ${k}">${k}</span>` : '';
const closed = new Set();
// Files as a tree of folders, each folder with the lines of everything in it. A folder holding only
// one folder is one row (src/components); clicking a folder folds it.
function treeHtml(files, row, key) {
  const root = { dirs: new Map(), files: [] };
  for (const f of files) {
    const parts = f.path.split('/'); let n = root;
    for (const part of parts.slice(0, -1)) { if (!n.dirs.has(part)) n.dirs.set(part, { name: part, dirs: new Map(), files: [] }); n = n.dirs.get(part); }
    n.files.push({ ...f, name: parts.at(-1) });
  }
  const sum = n => [...n.dirs.values()].map(sum).concat(n.files.map(f => [f.added || 0, f.removed || 0])).reduce((x, y) => [x[0] + y[0], x[1] + y[1]], [0, 0]);
  const by = (a, b) => a.name.localeCompare(b.name);
  const walk = (n, depth, at) => [...n.dirs.values()].sort(by).map(d => {
    let name = d.name; while (!d.files.length && d.dirs.size === 1) { d = [...d.dirs.values()][0]; name += '/' + d.name; }
    const k = key + ':' + at + name, shut = closed.has(k), [a, r] = sum(d);
    return `<div class="tr folder" data-dir="${esc(k)}" style="--d:${depth}"><span class="chev">${shut ? '▸' : '▾'}</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="ell">${esc(name)}</span>${stat(a, r)}</div>`
      + (shut ? '' : walk(d, depth + 1, at + name + '/'));
  }).join('') + n.files.sort(by).map(f => row(f, depth)).join('');
  return walk(root, 0, '');
}

let S, G, L, sel = keep('sel'), open = {}, last = {}, mode = '';
const folder = () => S?.folders.find(f => f.id === sel);
const statusOf = f => f.error ? ['bad', f.error] : f.pending || f.current ? ['busy', f.current ? 'Getting ' + f.current.split('/').pop() : `Getting ${plural(f.pending, 'file')}`]
  : !f.peers.length ? ['', 'Waiting for the others to come online'] : f.synced ? ['ok', 'In sync with ' + names(f.peers.map(label))] : ['busy', 'Catching up with ' + names(f.peers.map(label))];
// Draws a part only when it changed, so nothing typed or scrolled is lost.
const put = (el, html) => { if (el && last[el.id] !== html) { last[el.id] = html; el.innerHTML = html; } };

function render() {
  put($('#folders'), S.folders.map(f => {
    const [d] = statusOf(f);
    return `<button class="proj ${f.id === sel ? 'sel' : ''}" data-f="${f.id}"><div class="n"><span class="ell">${esc(f.name)}</span><span class="dot ${d}" style="margin-left:auto"></span></div>
      <div class="row"><span class="stack">${[S.device.name, ...f.peers].map(n => av(n, 'sm')).join('')}</span>${f.peers.length ? '' : 'Only here'}</div></button>`;
  }).join('') || '<div class="quiet">No projects yet</div>');
  put($('#peers'), S.peers.map(p => `<div class="near">${av(p.name, 'sm')}<span class="t ell">${esc(p.name)}${hd(p.name) ? `<div class="handle ell">${esc(hd(p.name))}</div>` : ''}<div class="s ell">${p.shared.length ? esc(names(p.shared)) : p.others ? 'Other projects' : 'Nothing shared'}</div></span></div>`).join('') || '<div class="quiet">No one else on this network</div>');
  put($('#me'), `${av(S.device.name, 'sm')}<span class="t ell">${esc(S.device.name)}${hd(S.device.name) ? `<div class="handle ell">${esc(hd(S.device.name))}</div>` : ''}</span><button class="icon" data-do="settings" title="Settings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>`);
  const f = folder(), main = $('#main');
  if (!f) {
    if (main.dataset.v !== 'hello') {
      main.dataset.v = 'hello'; last = {};
      main.innerHTML = `<div class="hello"><h1>One folder.<br>Every laptop.</h1><p>Whatever anyone saves shows up on the others a second later, and one button commits it all to GitHub.</p>
        <div class="pill"><button class="btn" data-do="new">Share a folder</button><button class="btn ghost" data-do="join">Join with a code</button></div>
        <div class="steps"><div><b>01</b><strong>Share</strong>Pick a folder on this laptop.</div><div><b>02</b><strong>Invite</strong>Your pals type a 4-digit code.</div><div><b>03</b><strong>Commit</strong>Anyone pushes to GitHub for everyone.</div></div></div>`;
    }
    return;
  }
  if (main.dataset.v !== f.id) {
    main.dataset.v = f.id; last = {}; mode = '';
    main.innerHTML = '<div class="wrap"><div class="head" id="head"></div><div id="bar"></div><div class="card"><h2 id="nowh"></h2><div id="compose"></div><div class="err" id="gerr"></div><div class="files" id="nowl"></div></div><div class="people" id="people"></div><div class="line" id="line"></div></div>';
  }
  const [d, text] = statusOf(f), inv = f.invite;
  put($('#head'), `<div class="t"><div class="status ${d === 'bad' ? 'bad' : ''}"><span class="dot ${d}"></span><span class="ell">${esc(text)}</span></div><h1>${esc(f.name)}</h1>
    <div class="facts"><button class="mono ell" data-do="open" title="Open the folder">${esc(f.path)}</button><span>${plural(f.files, 'file')} · ${size(f.bytes)}</span>${G?.branch ? `<span class="chip">${esc(G.branch)}</span>` : ''}</div></div>
    <div class="side"><span class="stack">${[S.device.name, ...f.peers].map(n => av(n, 'lg')).join('')}</span>
    <button class="btn ghost" data-do="invite">${inv ? `Code <span class="mono" style="color:var(--pri-t);font-weight:600;letter-spacing:.08em">${inv.code}</span>` : 'Invite'}</button>
    <button class="icon" data-do="menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button></div>`);
  put($('#bar'), d === 'busy' ? '<div class="bar"></div>' : '');
  renderNow(); renderLine(f);
}

function renderNow() {
  const want = !G ? 'loading' : G.no_git ? 'nogit' : G.repo ? 'commit' : 'connect';
  const n = G?.changes?.length || 0, busy = !!G?.busy;
  if (mode !== want) {
    mode = want;
    $('#compose').innerHTML = {
      loading: '<div class="none">Loading…</div>',
      nogit: `<h3>Git is not installed here</h3><p>Syncing works without it. To commit to GitHub, <button class="link" data-url="https://git-scm.com/downloads">get Git</button> and open this again.</p>`,
      connect: `<h3>Connect a GitHub repository</h3><p>The files stay as they are and the history comes in beside them. The other laptops connect by themselves.</p>
        <div class="pill" style="width:100%"><input class="field" id="url" placeholder="owner/repo" spellcheck="false"><button class="btn" data-do="connect">Connect</button></div>`,
      commit: `<textarea class="field" id="msg"></textarea><div class="foot"><span class="who" id="ident"></span><kbd>Ctrl Enter</kbd><button class="btn" data-do="commit">Commit and push</button></div>`,
    }[want];
  }
  if (want === 'connect') {
    const short = G.suggest.replace(/^https:\/\/github.com\/|\.git$/g, ''), url = $('#url');
    if (short && !url.value) url.value = short;
    $('[data-do="connect"]').disabled = busy; $('[data-do="connect"]').textContent = busy ? 'Connecting…' : 'Connect';
  }
  if (want === 'commit') {
    const msg = $('#msg'), b = $('[data-do="commit"]'), id = G.identity;
    msg.disabled = !n; msg.placeholder = n ? 'What changed? (optional)' : 'Nothing to commit';
    b.disabled = !n || busy; b.textContent = busy ? 'Working…' : G.remote ? 'Commit and push' : 'Commit';
    put($('#ident'), id.name && id.email ? `${av(id.name, 'sm')}<span class="ell">${esc(id.name)}</span><button class="link" data-do="identity">Change</button>` : `<button class="link" data-do="identity">Set the name your commits carry</button>`);
  }
  const acts = G?.repo ? [G.behind ? `<button class="btn ghost" data-do="pull">Get ${plural(G.behind, 'new commit')}</button>` : '', G.ahead ? `<button class="btn ghost" data-do="push">Push ${plural(G.ahead, 'commit')}</button>` : ''].join('') : '';
  const tot = (G?.changes || []).reduce((t, c) => [t[0] + (c.added || 0), t[1] + (c.removed || 0)], [0, 0]);
  put($('#nowh'), `Now${n ? ` · ${plural(n, 'change')} <span style="letter-spacing:0">${nums(tot[0], tot[1])}</span>` : ''}${G?.repo_web ? `<button class="link" style="text-transform:none;letter-spacing:0;font-weight:500" data-url="${esc(G.repo_web)}">${esc(G.repo_name)}</button>` : ''}<span class="acts">${acts}</span>`);
  put($('#gerr'), esc(G?.error || ''));
  put($('#nowl'), want === 'commit' ? (treeHtml(G.changes, (c, d) => `<div class="tr" style="--d:${d}" title="${esc(c.path)}${c.by ? ' · ' + esc(who(c.by)) : ''}"><span class="gap"></span>${c.by ? av(c.by, 'sm') : '<span class="av sm" style="opacity:0"></span>'}<span class="ell">${esc(c.name)}</span>${kindTag(c.kind)}${stat(c.added, c.removed)}</div>`, 'now')
    || '<div class="none" style="padding:10px 8px 0">Everything is committed.</div>') : '');
}

// The project's story: commits, and between them what each laptop changed (grouped, newest first).
// Who did what: each person's commits and lines over the whole history, and their share as a bar.
function renderPeople() {
  const ps = L?.people || [], total = ps.reduce((t, p) => t + p.added + p.removed, 0);
  put($('#people'), !ps.length ? '' : `<div class="card" style="padding:14px 18px"><h2>Contributors</h2>
    <div class="bar2">${ps.map(p => `<i style="--h:${hue(p.name)};width:${total ? 100 * (p.added + p.removed) / total : 100 / ps.length}%" title="${esc(p.name)}"></i>`).join('')}</div>
    <div class="plist">${ps.map(p => `<div class="person">${av(p.name, 'sm')}<b style="font-weight:600">${esc(p.name)}</b><span class="c">${plural(p.commits, 'commit')}</span><span class="stat" style="margin-left:4px">${nums(p.added, p.removed)}</span></div>`).join('')}</div></div>`);
}

function renderLine(f) {
  renderPeople();
  const groups = [];
  for (const a of f.activity.filter(a => a.kind !== 'followed')) {
    const verb = a.kind === 'deleted' ? 'deleted' : a.kind === 'conflict' ? 'conflict' : 'changed', name = a.mine ? S.device.name : a.who, g = groups.at(-1);
    if (g && g.name === name && g.verb === verb && verb !== 'conflict' && g.first - a.at < 300000) { if (!g.paths.includes(a.path)) g.paths.push(a.path); }
    else groups.push({ at: a.at, first: a.at, name, verb, paths: [a.path] });
  }
  const items = [...groups.map(g => ({ ...g, t: 'a' })), ...(L?.commits || []).map(c => ({ ...c, t: 'c' }))].sort((x, y) => y.at - x.at);
  put($('#line'), items.map(i => i.t === 'c' ? commitHtml(i) : `<div class="ev a">${av(i.name, 'sm')}<span class="ell">${i.verb === 'conflict'
      ? `<b>${esc(i.paths[0].split('/').pop())}</b> was changed here and by ${esc(who(i.name))}, so both copies are kept`
      : `${esc(who(i.name))} ${i.verb} <b style="color:var(--ink);font-weight:500">${esc(i.paths[0].split('/').pop())}</b>${i.paths.length > 1 ? ` and ${plural(i.paths.length - 1, 'other')}` : ''}`}</span><span class="when">${ago(i.at)}</span></div>`).join('')
    || `<div class="none">${G?.repo ? 'No commits yet.' : 'What anyone changes shows up here as it happens.'}</div>`);
}

function commitHtml(c) {
  let body = '';
  if (open.commit === c.hash) {
    const s = open.show;
    body = !s ? '<div class="open none" style="padding:12px 16px">Loading…</div>' : `<div class="open">${s.message.trim() !== c.subject ? `<div class="msg">${esc(s.message.trim())}</div>` : ''}
      ${treeHtml(s.files.map(x => ({ ...x, added: x.added === '-' ? null : +x.added, removed: x.removed === '-' ? null : +x.removed })), (x, d) => `<div class="tr" data-file="${esc(x.path)}" style="--d:${d};cursor:pointer"><span class="gap"></span><span class="ell">${esc(x.name)}</span>${kindTag(x.kind)}${stat(x.added, x.removed)}</div>${open.file === x.path ? diffHtml(open.diff) : ''}`, c.hash)}
      ${L.repo_web ? `<div style="padding:8px 8px 2px"><button class="link" style="font-size:12.5px" data-url="${esc(L.repo_web)}/commit/${c.hash}">View on GitHub</button></div>` : ''}</div>`;
  }
  return `<div class="ev c" data-c="${c.hash}" style="--h:${hue(c.author)}"><div class="s">${esc(c.subject)}</div>
    <div class="m">${av(c.author, 'sm')}<span>${esc(c.author)}</span>·<span>${ago(c.at)}</span>·<span class="mono">${c.hash.slice(0, 7)}</span>${c.local ? '<span class="tag">Not pushed</span>' : ''}<span class="stat">${nums(c.added, c.removed)} <span class="dim">· ${plural(c.files || 0, 'file')}</span></span>${blocks(c.added || 0, c.removed || 0)}</div></div>${body}`;
}

function diffHtml(d) {
  const lines = (d ?? '').split('\n').filter(l => !/^(diff --git|index |--- |\+\+\+ |new file mode|deleted file mode|Binary files)/.test(l));
  if (d == null || !lines.join('').trim()) return `<div class="none" style="padding:4px 10px">${d == null ? 'Loading…' : 'No text to show.'}</div>`;
  return `<pre>${lines.map(l => `<span class="${{ '+': 'a', '-': 'd', '@': 'h' }[l[0]] || ''}">${esc(l) || ' '}</span>`).join('')}</pre>`;
}

async function tick() {
  try { S = await api('/api/state'); } catch { return; }
  if (!folder() && S.folders.length) select(S.folders[0].id); else render();
}
async function gitTick() {
  const f = folder(); if (!f) return;
  try {
    const g = await api('/api/git?f=' + f.id);
    if (f.id !== sel) return;
    if (g.repo && (G?.head !== g.head || !L)) loadLog();
    G = g; render();
  } catch {}
}
async function loadLog() {
  const id = sel;
  try { const l = await api('/api/git/log?f=' + id); if (id === sel) { L = l; render(); } } catch {}
}
function select(id) {
  sel = id; keep('sel', id); G = L = null; open = {}; render(); gitTick();
}
const redraw = () => { delete last.line; render(); };

function sheet(html, init) {
  document.body.insertAdjacentHTML('beforeend', `<div class="shade"><div class="sheet">${html}<div class="err" id="er"></div></div></div>`);
  const sh = document.body.lastElementChild, close = () => { clearInterval(sh.timer); sh.remove(); };
  sh.onmousedown = e => e.target === sh && close();
  sh.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  const fail = e => $('#er', sh).textContent = e.message;
  init?.(sh, close, fail);
  sh.querySelector('input')?.focus();
}
const buttons = (go, on) => `<div class="foot"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="go" ${on ? '' : 'disabled'}>${go}</button></div>`;
const chooser = label => `<button class="chosen" id="pk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span id="ch">${label}</span></button>`;

function addSheet(join) {
  let path = '';
  sheet(join ? `<h3>Join a project</h3><p>Type the code the other laptop shows, then choose where the folder goes on this one.</p>
      <div class="tiles" id="cd">${'<input inputmode="numeric" maxlength="1" autocomplete="off">'.repeat(4)}</div>${chooser('Choose where to keep it')}${buttons('Join')}`
    : `<h3>Share a folder</h3><p>Everything in it stays the same on every laptop that joins. What its .gitignore files list stays on each laptop.</p>${chooser('Choose a folder')}${buttons('Share')}`, (sh, close, fail) => {
    const tiles = [...sh.querySelectorAll('#cd input')], code = () => tiles.map(t => t.value).join('');
    const check = () => $('#go', sh).disabled = !path || (join && code().length !== 4);
    tiles.forEach((t, i) => {
      t.oninput = () => { const v = t.value.replace(/\D/g, ''); t.value = v.slice(-1); if (v.length > 1) [...v].slice(0, 4 - i).forEach((c, k) => tiles[i + k].value = c); (tiles[Math.min(i + Math.max(v.length, 1), 3)] || t).focus(); check(); };
      t.onkeydown = e => { if (e.key === 'Backspace' && !t.value && i) tiles[i - 1].focus(); };
    });
    $('#pk', sh).onclick = async () => {
      try { path = (await api('/api/pick', { title: join ? 'Choose a folder for it (an empty one)' : 'Choose a folder to share' })).path || path; } catch (e) { fail(e); }
      if (path) $('#ch', sh).textContent = path; check();
    };
    $('#go', sh).onclick = async () => {
      $('#go', sh).disabled = true;
      try {
        const r = await api(join ? '/api/folders/join' : '/api/folders/new', { path, code: code() });
        close(); S = await api('/api/state');
        select((S.folders.find(x => x.id === r.message || x.path.toLowerCase() === path.toLowerCase()) || S.folders.at(-1)).id);
        join ? toast(r.message) : inviteSheet(folder());
      } catch (e) { fail(e); check(); }
    };
  });
}
async function inviteSheet(f) {
  try {
    const inv = f.invite || await api('/api/invite', { f: f.id });
    sheet(`<h3>Invite to ${esc(f.name)}</h3><p>On each other laptop, choose Join with a code and type this. Anyone you give it to can join.</p>
      <div class="tiles">${[...inv.code].map(c => `<div>${c}</div>`).join('')}</div><div class="timer" id="tm"></div>
      <div class="foot"><button class="btn" data-close style="margin-left:auto">Done</button></div>`, sh => {
      const t = () => { const s = Math.max(0, Math.round((inv.until - Date.now()) / 1000)); $('#tm', sh).textContent = s ? `Works for ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} more` : 'This code has run out; invite again for a new one'; };
      t(); sh.timer = setInterval(t, 1000);
    });
    tick();
  } catch (e) { toast(e.message); }
}
function settingsSheet() {
  sheet(`<h3>Settings</h3>
    <div class="set"><div class="k">This laptop</div><div class="row"><input class="field" id="nm" value="${esc(S.device.name)}"><button class="btn ghost" id="sv">Save</button></div></div>
    <div class="set"><div class="k">Laptops by address</div><p style="margin:0 0 10px;font-size:13px">For networks that keep laptops from finding each other. This one is at <span class="mono">${esc(S.addresses.join(', ') || 'no address')}</span>.</p>
      <div class="row"><input class="field mono" id="ad" placeholder="192.168.1.20" spellcheck="false"><button class="btn ghost" id="add">Add</button></div>
      ${S.manual.map(m => `<div class="file"><span class="mono">${esc(m)}</span><button class="link" style="margin-left:auto" data-rm="${esc(m)}">Remove</button></div>`).join('')}</div>
    <p style="margin:14px 0 0;font-size:12.5px">Githost ${esc(S.version)} keeps syncing after its window closes; opening it again brings the window back.</p>
    <div class="foot"><button class="btn ghost" id="quit">Quit Githost</button><button class="btn" data-close>Done</button></div>`, (sh, close, fail) => {
    const post = (path, body, done) => api(path, body).then(() => { done && toast(done); close(); tick(); }, fail);
    $('#sv', sh).onclick = () => post('/api/device', { name: $('#nm', sh).value }, 'Saved');
    $('#add', sh).onclick = () => post('/api/peers/add', { addr: $('#ad', sh).value }, 'Added');
    sh.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => post('/api/peers/remove', { addr: b.dataset.rm }));
    $('#quit', sh).onclick = async () => { await api('/api/quit', {}); document.body.innerHTML = '<div class="hello"><h1>Githost<br>has quit.</h1><p>Open it again to keep syncing.</p></div>'; window.close(); };
  });
}
function menu(anchor) {
  const f = folder(), r = anchor.getBoundingClientRect();
  document.body.insertAdjacentHTML('beforeend', `<div class="menu" style="top:${r.bottom + 6}px;right:${Math.max(8, innerWidth - r.right)}px"><button data-do="open">Open folder</button><button data-do="invite">${f.invite ? 'Show the invite' : 'Invite'}</button><button data-m class="danger">Stop syncing this folder</button></div>`);
  const m = document.body.lastElementChild;
  setTimeout(() => document.addEventListener('click', () => m.remove(), { once: true }));
  $('[data-m]', m).onclick = () => sheet(`<h3>Stop syncing ${esc(f.name)}?</h3><p>The files stay on this laptop. Changes stop going to and coming from the others.</p>${buttons('Stop syncing', true)}`, (sh, close) => {
    $('#go', sh).onclick = async () => { await api('/api/folders/remove', { id: f.id }); close(); sel = ''; tick(); };
  });
}

async function run(path, body) {
  if (G) { G.busy = true; render(); }
  try { toast((await api(path, { f: sel, ...body })).message); return true; } catch (e) { toast(e.message); return false; }
  finally { await gitTick(); loadLog(); }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-f],[data-dir],[data-do],[data-url],[data-c],[data-file]'), d = t?.dataset;
  if (!t) return;
  if (d.f) return d.f !== sel && select(d.f);
  if (d.dir) { closed.has(d.dir) ? closed.delete(d.dir) : closed.add(d.dir); delete last.nowl; return redraw(); }
  if (d.url) return api('/api/open-url', { url: d.url });
  if (d.file !== undefined) {
    open.file = open.file === d.file ? '' : d.file; open.diff = null; redraw();
    if (open.file) { open.diff = (await api(`/api/git/diff?f=${sel}&c=${open.commit}&path=${encodeURIComponent(open.file)}`).catch(() => ({ diff: '' }))).diff; redraw(); }
    return;
  }
  if (d.c) {
    open = open.commit === d.c ? {} : { commit: d.c }; redraw();
    if (open.commit) { open.show = await api(`/api/git/show?f=${sel}&c=${d.c}`).catch(() => ({ message: '', files: [] })); redraw(); }
    return;
  }
  const f = folder();
  ({
    new: () => addSheet(false), join: () => addSheet(true), settings: () => S && settingsSheet(), menu: () => menu(t),
    open: () => api('/api/open', { f: f.id }), invite: () => inviteSheet(f),
    identity: () => sheet(`<h3>Name on your commits</h3><p>Use the email of your GitHub account, so GitHub shows the commits as yours.</p>
      <input class="field" id="nm" placeholder="Name" value="${esc(G.identity.name)}"><input class="field" id="em" placeholder="Email" style="margin-top:10px" value="${esc(G.identity.email)}">${buttons('Save', true)}`,
      (sh, close, fail) => $('#go', sh).onclick = () => api('/api/git/identity', { f: sel, name: $('#nm', sh).value, email: $('#em', sh).value }).then(() => { close(); gitTick(); }, fail)),
    connect: () => run('/api/git/connect', { url: $('#url').value }),
    commit: async () => { if (await run('/api/git/commit', { message: $('#msg').value }) && $('#msg')) $('#msg').value = ''; },
    pull: () => run('/api/git/pull'), push: () => run('/api/git/push'),
  })[d.do]?.();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.shade,.menu').forEach(x => x.remove());
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'msg') $('[data-do="commit"]:not(:disabled)')?.click();
});

tick().then(gitTick);
setInterval(tick, 1000);
setInterval(gitTick, 2500);
setInterval(redraw, 30000);
</script>
</body>
</html>
